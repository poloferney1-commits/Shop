<!DOCTYPE html>
<html lang="en">
<head>

    <title>Catálogo | Tu Empresa</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contenedor-colores {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .circulo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: transform 0.2s;
        }
        .circulo:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <nav  class="navbar navbar-expand navbar-dark bg-dark sticky-top">
  <div class="container-fluid">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" style="color: blanchedalmond;" href="index.html">Zapatos</a>

  </div>

    <header>
        <img style="width: 45%; height: auto;" src="imagen/logofershop.jfif" alt="NIKE mine">
        <h2 class="fuente-especial">SOMOS TU FLOW</h2>
    </header>

    <div id="Zapatos" class="category-divider" class="search-container">
        <input type="text" id="product-search" placeholder="¿Qué estás buscando?">
    </div>

    <main class="product-grid" id="grid">
         <div class="product-card">
            <img src="gorras/CAP CHROME.jpeg" id="img-chrome" alt="NIKE mine">
            <h3>CAP CHROME</h3>
            <p class="price"> $50.000 COP </p>
            <div class="contenedor-colores">
            <span class="circulo" style="background-color: #ff09de;" onclick="cambiarColor('img-chrome', 'gorras/CAP CHROME.jpeg')"></span>
            <span class="circulo" style="background-color: #000000;" onclick="cambiarColor('img-chrome', 'gorras/CRUHOMENE.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #ffffff 50%, #000000 50%);" onclick="cambiarColor('img-chrome', 'gorras/CHBN.jpeg')"></span>
            </div>
            <button class="buy-btn" data-product="Nike Air Max Retro" data-price="$290.000">Pedir por WhatsApp</button>
        </div>

        <div class="product-card">
            <img src="gorras/CAP GODSPEED.jpeg" id="img-godspeed" alt="Retro 5">
            <h3>CAP GODSPEED</h3>
            <p class="price">$165.000 COP</p>
            <div class="contenedor-colores">
                <span class="circulo" style="background-color: #000000;" onclick="cambiarColor('img-godspeed', 'gorras/CAP GODSPEED.jpeg')"></span>
                <span class="circulo" style="background-color: #44b3f3;" onclick="cambiarColor('img-godspeed', 'gorras/GOSPEEDAZUL.jpeg')"></span>
                <span class="circulo" style="background-color: #ff3030;" onclick="cambiarColor('img-godspeed', 'gorras/GODSPER.jpeg')"></span>
                <span class="circulo" style="background-color: #32705b;" onclick="cambiarColor('img-godspeed', 'gorras/GOOSPEDVER.jpeg')"></span>
                <span class="circulo" style="background-color: #c0c4bfda;" onclick="cambiarColor('img-godspeed', 'gorras/GOOSPEEDGREY.jpeg')"></span>
            </div>
            <button class="buy-btn" data-product="Adidas Forum Low" data-price="$310.000">Pedir por WhatsApp</button>
        </div>

        <div class="product-card">
            <img style="width: 80%; max-width: 450px; " id="img-lous" src="gorras/CAP LOUIS VUITTON.jpeg" alt="Producto 3">
            <h3>CAP LOUIS VUITTON</h3>
            <p class="price">$60.000 COP</p>
            <div class="contenedor-colores">
            <span class="circulo" style="background-color: #ffa3fa;" onclick="cambiarColor('img-lous', 'gorras/CAP LOUIS VUITTON.jpeg')"></span>
            <span class="circulo" style="background-color: #8edfff;" onclick="cambiarColor('img-lous', 'gorras/lousAZ.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #ffffff 50%, #000000 50%);" onclick="cambiarColor('img-lous', 'gorras/LOUS.jpeg')"></span>
            </div>
            <button class="buy-btn" data-product="Jordan 1 Mid Green" data-price="$350.000">Pedir por WhatsApp</button>
        </div>
        <div class="product-card">
            <img src="gorras/W MERCH.jpeg" alt="Producto 3">
            <h3>W MERCH</h3>
            <p class="price">$55.000 COP</p>
            <button class="buy-btn" data-product="Jordan 1 Mid Green" data-price="$350.000">Pedir por WhatsApp</button>
        </div>
         <div class="product-card">
            <img src="gorras/NRBA.jpeg" id="img-chrome2" alt="NIKE mine">
            <h3>CAP CHROME</h3>
            <p class="price"> $55.000 COP </p>
            <div class="contenedor-colores">
            <span class="circulo" style="background: linear-gradient(90deg, #ffffff 33.33%, #000000 33.33%, #f12525 66.66%, #0d2cd8 66.66%);" onclick="cambiarColor('img-chrome2', 'gorras/NRBA.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #b8d9ff 50%, #ffffff 50%);" onclick="cambiarColor('img-chrome2', 'gorras/AZB.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #ffb8ea 50%, #ffffff 50%);" onclick="cambiarColor('img-chrome2', 'gorras/RB.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #f71616 50%, #ffffff 50%);" onclick="cambiarColor('img-chrome2', 'gorras/ROJOBL.jpeg')"></span>
            <span class="circulo" style="background: linear-gradient(90deg, #000000 33.33%, #ffffff 33.33%, #f12525 66.66%, #0d2cd8 66.66%);" onclick="cambiarColor('img-chrome2', 'gorras/nRA.jpeg')"></span>
            </div>
            <button class="buy-btn" data-product="Nike Air Max Retro" data-price="$290.000">Pedir por WhatsApp</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function cambiarColor(idDelContenedorImg, rutaNuevaImagen) {
            document.getElementById(idDelContenedorImg).src = rutaNuevaImagen;
        }
    </script>
