<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Tu Empresa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TU EMPRESA</h1>
        <p>Envíos a todo el país</p>
    </header>

    <div class="search-container">
        <input type="text" id="product-search" placeholder="¿Qué estás buscando?">
    </div>

    <main class="product-grid" id="grid">
        <div class="product-card">
            <img src="https://www.pngarts.com/files/3/Running-Shoes-PNG-Transparent-Image.png" alt="Producto 1">
            <h3>Nike Air Max Retro</h3>
            <p class="price">$290.000 COP</p>
            <button class="buy-btn" data-product="Nike Air Max Retro" data-price="$290.000">Pedir por WhatsApp</button>
        </div>

        <div class="product-card">
            <img src="https://www.pngarts.com/files/3/Running-Shoes-PNG-Transparent-Image.png" alt="Producto 2">
            <h3>Adidas Forum Low</h3>
            <p class="price">$310.000 COP</p>
            <button class="buy-btn" data-product="Adidas Forum Low" data-price="$310.000">Pedir por WhatsApp</button>
        </div>

        <div class="product-card">
            <img src="https://www.pngarts.com/files/3/Running-Shoes-PNG-Transparent-Image.png" alt="Producto 3">
            <h3>Jordan 1 Mid Green</h3>
            <p class="price">$350.000 COP</p>
            <button class="buy-btn" data-product="Jordan 1 Mid Green" data-price="$350.000">Pedir por WhatsApp</button>
        </div>
        <div class="product-card">
            <img src="C:\Users\Usuario\Desktop\Shop\imagen\jordan-11.jpeg" alt="Producto 3">
            <h3>Jordan 11 Red</h3>
            <p class="price">$670.000 COP</p>
            <button class="buy-btn" data-product="Jordan 1 Mid Green" data-price="$350.000">Pedir por WhatsApp</button>
        </div>

        <div class="product-card">
    <img src="[attachment_0](attachment)" alt="Jordan Retro 5">
    <h3>Air Jordan 5 Retro</h3>
    <p class="price">$450.000 COP</p>
    <button class="buy-btn" data-product="Jordan Retro 5" data-price="$450.000">Pedir por WhatsApp</button>
</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
